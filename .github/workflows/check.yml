name: check

on:
  schedule:
    # O cron do Actions e best-effort e atrasa muito: medido neste repo, dispara
    # a cada 40-70 min, nao a cada 10. Por isso cada execucao roda o bot em laco
    # por 50 min, verificando a cada 7-12 min -- igual ao modo local do projeto.
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: watch
  cancel-in-progress: false

# O catalogo vive no cache, nunca no git. O write abaixo e so pro keepalive.
permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # O estado da rodada anterior vem do cache, nunca do repositorio.
      - name: Restaurar estado
        uses: actions/cache/restore@v4
        with:
          path: estado.json
          key: estado-${{ github.run_id }}
          restore-keys: estado-

      - name: Jitter
        run: sleep $((RANDOM % 150))

      - name: Rodar
        env:
          WATCH_BASE: ${{ secrets.WATCH_BASE }}
          WATCH_FLOW: ${{ secrets.WATCH_FLOW }}
          WATCH_ID: ${{ secrets.WATCH_ID }}
          WATCH_TOPIC: ${{ secrets.WATCH_TOPIC }}
          WATCH_ENTRY: ${{ secrets.WATCH_ENTRY }}
          WATCH_SECTIONS: ${{ secrets.WATCH_SECTIONS }}
          WATCH_MENU: ${{ secrets.WATCH_MENU }}
        run: |
          cp -f estado.json estado.prev 2>/dev/null || true
          timeout 3000 python3 bot.py --loop || true

      - name: Mudou?
        id: diff
        run: |
          if cmp -s estado.json estado.prev; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Grava uma entrada nova so quando o catalogo muda.
      - name: Salvar estado
        if: steps.diff.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: estado.json
          key: estado-${{ github.run_id }}

            # Um commit vazio a cada ~50 dias zera o contador. Nao publica conteudo.
      - name: Manter o agendamento vivo
        run: test $(( ($(date +%s) - $(git log -1 --format=%ct)) / 86400 )) -ge 50 && git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit --allow-empty -m keepalive && git push || true
